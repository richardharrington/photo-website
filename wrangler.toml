name = "photo-assets"
main = "worker/src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true

# Daily maintenance: trash purge, orphan sweep, snapshot pruning.
[triggers]
crons = ["17 4 * * *"]

[observability.logs]
enabled = true
invocation_logs = true

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "family-photos"
preview_bucket_name = "family-photos-dev"

# ASSET_SIGNING_KEY is a secret, set with `wrangler secret put ASSET_SIGNING_KEY`.
# It is never placed in this file.
[vars]
CATALOG_CACHE_SECONDS = "60"
