[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Deploy previews and branch deploys are disabled by design (design.md,
# "Deployment and account security"): testing happens locally, then production
# deploys directly. The `ignore` command exits 0 to skip the build entirely.
# Also turn both off in the Netlify UI — this file alone is not the control.
[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  path = "/*"
  function = "gate"
